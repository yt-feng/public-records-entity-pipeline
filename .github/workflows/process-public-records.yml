name: Process public records

on:
  workflow_dispatch:
    inputs:
      expand_relations:
        description: "Fetch another bounded public relationship wave before rebuilding"
        required: true
        default: false
        type: boolean
      harvest_candidates:
        description: "Harvest a public structured-family candidate layer before rebuilding"
        required: true
        default: false
        type: boolean
      source_offset:
        description: "Zero-based source QID offset for a resumable relation batch"
        required: true
        default: "0"
        type: string
      source_limit:
        description: "Maximum source QIDs in this batch; 300 keeps API work bounded"
        required: true
        default: "300"
        type: string
      auto_continue:
        description: "Queue the next bounded relation batch after a successful run"
        required: true
        default: false
        type: boolean
      source_cycle:
        description: "Bounded source-list pass number used by automatic continuation"
        required: true
        default: "0"
        type: string
      fast_mode:
        description: "Update JSON entity state without rewriting the workbook on every wave"
        required: true
        default: true
        type: boolean
      materialize_workbook:
        description: "Write the accumulated public JSON state back into the XLSX"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    # XLSX materialization rewrites the accumulated public workbook several
    # times after the fast JSON target is reached. Keep the work on the public
    # runner instead of falling back to local processing, and allow enough time
    # for the large file to finish and pass the full public-build scan.
    timeout-minutes: 360
    steps:
      - name: Check out current state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbook runtime
        run: python -m pip install -r requirements.txt

      - name: Expand public relationship edges
        if: ${{ inputs.expand_relations == true }}
        env:
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
          RELATION_SOURCE_CYCLE: ${{ inputs.source_cycle }}
        run: |
          echo "Processing source offset ${RELATION_SOURCE_OFFSET} with limit ${RELATION_SOURCE_LIMIT}"
          python extract_relation_wave.py
          if [ "${{ inputs.fast_mode }}" != "true" ]; then
            python append_relation_wave.py
          fi

      - name: Harvest structured candidates
        if: ${{ inputs.harvest_candidates == true && inputs.fast_mode == false }}
        run: |
          python harvest_structured_candidates.py
          python harvest_royalty_candidates.py
          python append_structured_candidates.py

      - name: Update fast unique progress
        if: ${{ inputs.fast_mode == true && inputs.expand_relations == true }}
        env:
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
          RELATION_SOURCE_CYCLE: ${{ inputs.source_cycle }}
        run: python update_fast_progress.py

      - name: Rebuild unique layers
        if: ${{ inputs.fast_mode == false }}
        run: |
          python build_entity_network_layer.py
          python materialize_scope_view.py
          python validate_public_build.py

      - name: Materialize workbook at target
        if: ${{ inputs.fast_mode == true && inputs.materialize_workbook == true }}
        id: requested_materialization
        run: |
          python append_relation_wave.py
          python build_entity_network_layer.py
          python materialize_scope_view.py
          python validate_public_build.py

      - name: Materialize workbook when target is reached
        if: ${{ inputs.fast_mode == true && inputs.expand_relations == true && inputs.materialize_workbook == false }}
        id: target_materialization
        run: |
          unique=$(python -c 'import json; print(json.load(open("data/pipeline_progress.json"))["unique_entities"])')
          if [ "$unique" -ge 100000 ]; then
            echo "Fast unique target reached: ${unique}; materializing workbook"
            python append_relation_wave.py
            python build_entity_network_layer.py
            python materialize_scope_view.py
            python validate_public_build.py
            RELATION_SOURCE_OFFSET=${{ inputs.source_offset }} \
            RELATION_SOURCE_LIMIT=${{ inputs.source_limit }} \
            RELATION_SOURCE_CYCLE=${{ inputs.source_cycle }} \
              python write_progress.py
            echo "materialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fast unique target not reached: ${unique}"
            echo "materialized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record progress
        if: ${{ inputs.fast_mode == false }}
        env:
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
          RELATION_SOURCE_CYCLE: ${{ inputs.source_cycle }}
        run: python write_progress.py

      - name: Record materialized progress
        if: ${{ inputs.fast_mode == true && inputs.materialize_workbook == true }}
        env:
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
          RELATION_SOURCE_CYCLE: ${{ inputs.source_cycle }}
        run: python write_progress.py

      - name: Upload processed workbook
        if: ${{ inputs.fast_mode == false || inputs.materialize_workbook == true || steps.target_materialization.outputs.materialized == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: entity-network-workbook
          path: inputs/entity_network_master.xlsx
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inputs/entity_network_master.xlsx data/structured_candidate_records.json data/pipeline_progress.json data/fast_entity_index.json
          # Stage the compressed state and its intentional legacy-file removal
          # without requiring the absent legacy JSON path to exist.
          git add -A data
          git diff --cached --quiet || git commit -m "chore: refresh processed public records"
          git push

      - name: Queue next relation batch
        if: ${{ inputs.auto_continue == true && inputs.expand_relations == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
          RELATION_SOURCE_CYCLE: ${{ inputs.source_cycle }}
        run: |
          unique=$(python -c 'import json; print(json.load(open("data/pipeline_progress.json"))["unique_entities"])')
          available=$(python -c 'import json; print(json.load(open("data/pipeline_progress.json"))["all_source_qids"])')
          offset=${RELATION_SOURCE_OFFSET}
          limit=${RELATION_SOURCE_LIMIT}
          cycle=${RELATION_SOURCE_CYCLE}
          if [ "$unique" -ge 100000 ]; then
            echo "Unique target reached: ${unique}; no further batch queued"
            exit 0
          fi
          next=$((offset + limit))
          if [ "$next" -ge "$available" ]; then
            next=0
            cycle=$((cycle + 1))
          fi
          if [ "$cycle" -gt 5 ]; then
            echo "Maximum automatic source-list cycles reached: ${cycle}"
            exit 0
          fi
          echo "Queueing next relation batch: offset=${next}, limit=${limit}, cycle=${cycle}, available=${available}"
          gh workflow run process-public-records.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f expand_relations=true \
            -f harvest_candidates=false \
            -f source_offset="$next" \
            -f source_limit="$limit" \
            -f auto_continue=true \
            -f source_cycle="$cycle" \
            -f fast_mode=true \
            -f materialize_workbook=false

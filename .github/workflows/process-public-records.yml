name: Process public records

on:
  workflow_dispatch:
    inputs:
      expand_relations:
        description: "Fetch another bounded public relationship wave before rebuilding"
        required: true
        default: false
        type: boolean
      harvest_candidates:
        description: "Harvest a public structured-family candidate layer before rebuilding"
        required: true
        default: false
        type: boolean
      source_offset:
        description: "Zero-based source QID offset for a resumable relation batch"
        required: true
        default: "0"
        type: string
      source_limit:
        description: "Maximum source QIDs in this batch; 300 keeps API work bounded"
        required: true
        default: "300"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out current state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workbook runtime
        run: python -m pip install -r requirements.txt

      - name: Expand public relationship edges
        if: ${{ inputs.expand_relations == true }}
        env:
          RELATION_SOURCE_OFFSET: ${{ inputs.source_offset }}
          RELATION_SOURCE_LIMIT: ${{ inputs.source_limit }}
        run: |
          echo "Processing source offset ${RELATION_SOURCE_OFFSET} with limit ${RELATION_SOURCE_LIMIT}"
          python extract_relation_wave.py
          python append_relation_wave.py

      - name: Harvest structured candidates
        if: ${{ inputs.harvest_candidates == true }}
        run: |
          python harvest_structured_candidates.py
          python harvest_royalty_candidates.py
          python append_structured_candidates.py

      - name: Rebuild unique layers
        run: |
          python build_entity_network_layer.py
          python materialize_scope_view.py
          python validate_public_build.py

      - name: Upload processed workbook
        uses: actions/upload-artifact@v4
        with:
          name: entity-network-workbook
          path: inputs/entity_network_master.xlsx
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inputs/entity_network_master.xlsx data/relation_wave_records.json data/structured_candidate_records.json
          git diff --cached --quiet || git commit -m "chore: refresh processed public records"
          git push
